# Workflow: Deploy to GitHub Pages
# Builds and deploys the static site to GitHub Pages on every push to main (and manual workflow_dispatch).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual trigger: start a clean run without a re-run (avoids duplicate Pages artifacts)
  workflow_dispatch:

# Least privilege needed: read repository + publish GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight Pages deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble publish directory
        run: |
          mkdir _site
          # Only ship the site itself: html, css, js, assets, pages, and SEO files
          cp index.html sitemap.xml robots.txt _site/
          cp google90204ddbeb9f3cf5.html _site/   # Search Console verification
          cp -r assets css js projects resume _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4