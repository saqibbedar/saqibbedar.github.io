description = """
### Developer Tooling & Template Documentation

- **Template Documentation**: Added comprehensive `docs/GUIDE.md` detailing how to adapt, customize, and deploy this portfolio template.
- **Contribution Guidelines**: Added `CONTRIBUTING.md` outlining bug reporting, accessibility best practices, local testing, and pull request workflows.
- **README Overhaul**: Completely updated `README.md` with modernized badges, updated file tree, local preview options (Python and Docker), and developer guides.
- **Local Developer Tooling**: Added `Justfile` automation (`val_html`, `val_release`) backed by modular Python verification scripts in `scripts/`.
- **CI/CD Architecture**: Decoupled GitHub Pages deployments (push to `main`) from release automation (push to `release`), with automated pull request security audits via Gitleaks and Trivy `v0.36.0`.
"""